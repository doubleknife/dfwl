spring:
  application:
    name: fleet-ops-backend
  datasource:
    url: jdbc:mysql://localhost:3306/fleet_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

fleet:
  storage:
    local-root: /data/dfwl/files
  ocr:
    provider: TENCENT
    tencent:
      secret-id:
      secret-key:
      region: ap-guangzhou
