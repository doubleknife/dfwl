spring:
  application:
    name: fleet-ops-backend
  datasource:
    url: jdbc:mysql://localhost:3306/fleet_ops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: fleet_ops
    password: fleet_ops
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

fleet:
  ocr:
    provider: DISABLED
    tencent:
      secret-id: ""
      secret-key: ""
      region: ""
