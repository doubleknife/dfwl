      summary: 当前角色可发起的已发布模板
      x-permission: approval:create
      responses: {'200': {description: 模板列表}}
  /approval-templates/options:
    get:
      tags: [Approvals]
      summary: 流程配置角色与审批人选择项
      x-permission: approval:flow:manage
      responses: {'200': {description: 选择项}}
  /approval-templates/{id}/versions:
    post:
      tags: [Approvals]
      summary: 创建冻结模板的下一草稿流程版本；有在途实例时拒绝
      x-permission: approval:flow:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalTemplateInput'}}}
      responses: {'200': {description: 新草稿流程}}
  /approval-flows/{id}:
    get:
      tags: [Approvals]
      summary: 查看流程版本及稳定 flowNodeId
      x-permission: approval:flow:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 流程版本}}
  /approval-flows/{id}/publish:
    post:
      tags: [Approvals]
      summary: 发布草稿流程版本
      x-permission: approval:flow:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 已发布流程}}
  /approvals:
    get:
      tags: [Approvals]
      summary: 待我处理、我的申请或审批记录
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [TODO, MINE, HISTORY]}}
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1}}
      responses: {'200': {description: 审批分页}}
    post:
      tags: [Approvals]
      summary: 发起单笔 DAILY/TASK 费用、普通审批或换胎审批
      x-permission: approval:create
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalApplication'}}}
      responses: {'200': {description: 审批实例、冻结流程与首次 Submission}}
  /approvals/{id}:
    get:
      tags: [Approvals]
      summary: 审批详情、明细、Submission、时间线和附件
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 审批详情}}
  /approvals/{id}/returnable-steps:
    get:
      tags: [Approvals]
      summary: 当前实例实际合法可返回步骤及稳定 flowNodeId
      x-permission: approval:return
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 合法步骤列表；无中间步骤时为空}}
  /approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: 通过当前步骤；费用终审按明细幂等生成 ExpenseEntry
      x-permission: approval:process
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalAction'}}}}
      responses: {'200': {description: 新审批状态}}
  /approvals/{id}/return-step:
    post:
      tags: [Approvals]
      summary: 返回冻结流程中已实际经过的指定步骤
      x-permission: approval:return
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalAction'}}}}
      responses: {'200': {description: 新 Submission 与重新执行的目标步骤}}
  /approvals/{id}/return-applicant:
    post:
      tags: [Approvals]
      summary: 打回原申请人修改
      x-permission: approval:return
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalAction'}}}}
      responses: {'200': {description: 已打回申请人}}
  /approvals/{id}/resubmit:
    post:
      tags: [Approvals]
      summary: 原申请人修改后形成新 Submission Version
      x-permission: approval:create
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalResubmission'}}}}
      responses: {'200': {description: 重新进入冻结流程}}
  /expense-applications/options:
    get:
      tags: [ExpenseApplications]
      summary: 日常/任务费用的正式司机、公司车辆选择项
      x-permission: approval:create
      responses: {'200': {description: 司机与公司车辆；外协司机拒绝}}
  /expense-applications/task-candidates:
    get:
      tags: [ExpenseApplications]
      summary: 指定司机正式参与的任务候选；司机账号只能查本人
      x-permission: approval:create
      parameters: [{name: driverId, in: query, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 任务候选}}
  /expense-applications/daily-template:
    get:
      tags: [ExpenseApplications]
      summary: 下载唯一固定 DAILY Excel 模板
      x-permission: approval:create
      responses: {'200': {description: XLSX 文件}}
  /expense-applications/daily-preview:
    post:
      tags: [ExpenseApplications]
      summary: 预览全部行、金额合计和错误；不产生审批
      x-permission: approval:create
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}}}}}
      responses: {'200': {description: 行级校验结果}}
  /expense-applications/daily-submit:
    post:
      tags: [ExpenseApplications]
      summary: 服务端重新解析固定 Excel；N 条明细形成一个审批实例
      x-permission: approval:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, templateId, requestKey]
              properties:
                file: {type: string, format: binary}
                templateId: {type: integer, format: int64}
                requestKey: {type: string}
      responses: {'200': {description: 单一审批实例}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    YearMonth: {name: yearMonth, in: path, required: true, schema: {type: string}}
  responses:
    BusinessConflict:
      description: 业务规则冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
  schemas:
    ApprovalTemplateInput:
      type: object
      required: [stableCode, name, businessType, initiatorRoleIds, nodes]
      properties:
        stableCode: {type: string}
        name: {type: string}
        businessType: {type: string, enum: [EXPENSE, GENERAL, TIRE_REPLACEMENT]}
        expenseType: {type: string, nullable: true}
        initiatorRoleIds: {type: array, items: {type: integer, format: int64}}
        nodes:
          type: array
          items:
            type: object
            required: [name, approverUserId]
            properties:
              name: {type: string}
              approverUserId: {type: integer, format: int64}
              allowReturn: {type: boolean}
    ApprovalExpenseItem:
      type: object
      required: [businessDate, vehicleId, driverId, amount]
      properties:
        businessDate: {type: string, format: date}
        vehicleId: {type: integer, format: int64}
        driverId: {type: integer, format: int64}
        targetTaskId: {type: integer, format: int64, nullable: true}
        amount: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        description: {type: string, nullable: true}
        receiptNo: {type: string, nullable: true}
        invoiceNo: {type: string, nullable: true}
        remark: {type: string, nullable: true}
        stationName: {type: string, nullable: true}
    ApprovalApplication:
      type: object
      required: [templateId, requestKey]
      properties:
        templateId: {type: integer, format: int64}
        requestKey: {type: string}
        applicationScope: {type: string, enum: [DAILY, TASK], nullable: true}
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}}
        generalSnapshot: {type: object, additionalProperties: true}
        tireRequestId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApprovalAction:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer}
        comment: {type: string}
        targetFlowNodeId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApprovalResubmission:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}}
        generalSnapshot: {type: object, additionalProperties: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, examples: ['0']}
        message: {type: string}
        data: {}
        requestId: {type: string}
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string}
    CurrentUser:
      type: object
      description: 当前登录账号、单一角色、权限，以及司机账号的小程序身份扩展信息。
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        role:
          type: object
          properties:
            id: {type: integer, format: int64}
            code: {type: string}
            name: {type: string}
        permissions:
          type: array
          items: {type: string}
        driverId: {type: [integer, 'null'], format: int64}
        driverType: {type: [string, 'null'], enum: [INTERNAL, OUTSOURCED, null]}
        driverName: {type: [string, 'null']}
        currentVehicleId: {type: [integer, 'null'], format: int64}
        currentPlateNo: {type: [string, 'null']}
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: integer, enum: [0, 1]}
    ProductRequest:
      type: object
      required: [name, enabled]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        expectedVersion: {type: [integer, 'null']}
    UserRequest:
      type: object
      required: [phone, roleId, status]
      properties:
        phone: {type: string}
        password: {type: [string, 'null'], description: 新增账号必填；编辑账号不使用该字段重置密码}
        roleId: {type: integer, format: int64}
        status: {type: integer, enum: [0, 1]}
    RoleRequest:
      type: object
      required: [roleCode, roleName, status]
      properties:
        roleCode: {type: string}
        roleName: {type: string}
        status: {type: integer, enum: [0, 1]}
    RolePermissionRequest:
      type: object
      properties:
        permissionCodes:
          type: array
          items: {$ref: '#/components/schemas/PermissionCode'}
    TaskStatus:
      type: string
      enum: [UNPUBLISHED, PUBLISHED, IN_TRANSIT, TRANSFER_PENDING, COMPLETED, CANCELLED]
    AttachmentPurpose:
      type: string
      enum: [WEIGHT_ADJUST, ROUTE_UNLOAD_WEIGHT_TICKET, IMPORT_FILE]
    Attachment:
      type: object
      required: [id, ownerType, ownerId, purpose, storageKey, originalFilename, fileSize, fileHash, uploadedBy, uploadedAt]
      properties:
        id: {type: integer, format: int64}
        ownerType: {type: string}
        ownerId: {type: integer, format: int64}
        purpose: {$ref: '#/components/schemas/AttachmentPurpose'}
        originalFilename: {type: string}
        contentType: {type: [string, 'null']}
        fileSize: {type: integer, format: int64}
        fileHash: {type: string}
        storageKey: {type: string}
        uploadedBy: {type: integer, format: int64}
        uploadedAt: {type: string, format: date-time}
    DecimalMoney:
      type: string
      pattern: '^\\d{1,16}(\\.\\d{1,2})?$'
      description: 金额 DECIMAL(18,2)，接口以字符串传输避免浮点误差。
    DecimalWeight:
      type: string
      pattern: '^\\d{1,15}(\\.\\d{1,3})?$'
      description: 重量/电量/气量 DECIMAL(18,3)，接口以字符串传输避免浮点误差。
    DriverCreateRequest:
      type: object
      required: [driverType, name, phone, status]
      properties:
        driverType: {type: string, enum: [INTERNAL, OUTSOURCED]}
        name: {type: string}
        phone: {type: string}
        status: {type: integer, enum: [0, 1]}
        initialPassword: {type: [string, 'null'], writeOnly: true, description: 仅新建 DRIVER User 时必填；已有合法账号时不改原密码}
        vehicleLicenseNo: {type: [string, 'null']}
        drivingLicenseNo: {type: [string, 'null']}
        idCardNo: {type: [string, 'null']}
        birthDate: {type: [string, 'null'], format: date}
    RouteTemplateRequest:
      type: object
      required: [stableCode, name, customerName, productId, loadingPlace, unloadingPlace, defaultUnitPrice, defaultInformationFee, defaultDriverSalary]
      properties:
        stableCode: {type: string, maxLength: 64}
        name: {type: string, maxLength: 128}
        customerName: {type: string, maxLength: 128}
        productId: {type: integer, format: int64}
        loadingPlace: {type: string}
        unloadingPlace: {type: string}
        defaultUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
        defaultInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
        defaultDriverSalary: {$ref: '#/components/schemas/DecimalMoney'}
        remark: {type: [string, 'null']}
        expectedVersion: {type: [integer, 'null'], description: 更新时必填}
    DispatchBatchRequest:
      type: object
      required: [businessDate, rows]
      properties:
        businessDate: {type: string, format: date}
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [templateStableCode, driverId]
            properties:
              templateStableCode: {type: string}
              driverId: {type: integer, format: int64}
              outsourcedPlateNo: {type: [string, 'null'], description: 后端确认司机为 OUTSOURCED 时必填}
              actualUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
              actualInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
              initialSalary: {$ref: '#/components/schemas/DecimalMoney'}
              remark: {type: [string, 'null']}
    DispatchConfirmRequest:
      type: object
      required: [previewId, requestKey, batch]
      properties:
        previewId: {type: string}
        requestKey: {type: string}
        batch: {$ref: '#/components/schemas/DispatchBatchRequest'}
    TaskTransferRequest:
      type: object
      required: [newDriverId, allParticipantSalaries, newSalary, reason, expectedVersion, expectedCurrentParticipantId]
      properties:
        newDriverId: {type: integer, format: int64}
        outsourcedPlateNo: {type: [string, 'null']}
        allParticipantSalaries:
          type: array
          items:
            type: object
            required: [participantId, amount]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
        newSalary: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
        expectedVersion: {type: integer}
        expectedCurrentParticipantId: {type: integer, format: int64}
    TaskDepartRequest:
      type: object
      required: [requestKey, expectedVersion]
      properties:
        requestKey: {type: string}
        expectedVersion: {type: integer}
    TaskUnloadRequest:
      type: object
      required: [grossWeight, tareWeight, ticketAttachmentIds, requestKey]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        ticketAttachmentIds: {type: array, minItems: 1, items: {type: integer, format: int64}}
        requestKey: {type: string}
    TaskCancelRequest:
      type: object
      required: [reason, expectedVersion, requestKey]
      properties:
        reason: {type: string}
        expectedVersion: {type: integer}
        requestKey: {type: string}
    TaskWeightAdjustmentRequest:
      type: object
      required: [grossWeight, tareWeight, reason, expectedVersion]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        reason: {type: string}
        evidenceAttachmentIds: {type: array, items: {type: integer, format: int64}}
        expectedVersion: {type: integer}
    TaskAmountAdjustmentRequest:
      type: object
      required: [expectedVersion, amountKind, afterAmount, reason]
      properties:
        expectedVersion: {type: integer}
        amountKind: {type: string, enum: [UNIT_PRICE, INFORMATION_FEE]}
        afterAmount: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
    TaskSalariesConfirmRequest:
      type: object
      required: [salaries, reason, requestKey]
      properties:
        salaries:
          type: array
          items:
            type: object
            required: [participantId, amount, expectedVersion]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
              expectedVersion: {type: integer}
        reason: {type: string}
        requestKey: {type: string}
