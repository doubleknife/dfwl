      x-permission: approval:flow:manage
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalTemplateInput'}}}
      responses: {'200': {description: 草稿流程}}
  /approval-templates/available:
    get:
