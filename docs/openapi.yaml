openapi: 3.1.0
info:
  title: Fleet Operations API
  version: 3.0.0
  description: 车队经营管理系统统一 API 契约。详细业务规则以项目需求基线文档为准。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: Auth}
  - {name: Products}
  - {name: Drivers}
  - {name: Vehicles}
  - {name: Trailers}
  - {name: RouteTemplates}
  - {name: TaskImports}
  - {name: TransportTasks}
  - {name: DriverSalaries}
  - {name: Notifications}
  - {name: Attachments}
  - {name: Approvals}
  - {name: ExpenseApplications}
  - {name: System}
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 手机号密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /system/ping:
    get:
      tags: [System]
      security: []
      summary: 服务健康探测
      responses: {'200': {description: OK}}
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses: {'200': {description: OK}}
  /me:
    get:
      tags: [Auth]
      summary: 当前账号、角色、权限、小程序能力
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CurrentUser'}
  /auth/password:
    put:
      tags: [Auth]
      summary: 修改本人密码
      responses: {'200': {description: OK}}
  /users/{id}/reset-password:
    post:
      tags: [Auth]
      summary: 管理员重置密码
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /users/{id}/status:
    put:
      tags: [Auth]
      summary: 启用/停用账号
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /users:
    get:
      tags: [System]
      summary: 用户分页列表
      x-permission: user:manage
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增账号并分配单一非 DRIVER 角色；DRIVER 只能由司机业务流程创建或关联
      x-permission: user:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /users/{id}:
    get:
      tags: [System]
      summary: 用户详情
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑非 DRIVER 账号并保持单一角色；不可借此修改现有 DRIVER 账号或分配 DRIVER
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles:
    get:
      tags: [System]
      summary: 角色分页列表
      x-permission: role:manage
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增角色
      x-permission: role:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}:
    get:
      tags: [System]
      summary: 角色详情
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑角色
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}/status:
    put:
      tags: [System]
      summary: 启用/停用角色
      x-permission: role:manage
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: status, in: query, required: true, schema: {type: integer, enum: [0, 1]}}
      responses: {'200': {description: OK}}
  /roles/{id}/permissions:
    put:
      tags: [System]
      summary: 保存角色权限；权限码只能来自既定注册表
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissionRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /permissions:
    get:
      tags: [System]
      summary: 权限列表，支持按 MENU/BUTTON/API/MINI_PROGRAM 分类
      x-permission: permission:manage
      parameters:
        - {name: permissionType, in: query, required: false, schema: {type: string, enum: [MENU, BUTTON, API, MINI_PROGRAM]}}
      responses: {'200': {description: OK}}
  /audit-logs:
    get:
      tags: [System]
      summary: 操作日志分页查询
      x-permission: audit:view
      parameters:
        - {name: module, in: query, required: false, schema: {type: string}}
        - {name: businessType, in: query, required: false, schema: {type: string}}
        - {name: operatorId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: startTime, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: endTime, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK}}

  /products:
    get:
      tags: [Products]
      summary: 货物分页列表
      x-permission: template:view
      responses: {'200': {description: OK}}
    post:
      tags: [Products]
      summary: 新增货物
      x-permission: template:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /products/{id}:
    put:
      tags: [Products]
      summary: 编辑货物
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}}
  /products/{id}/status:
    put:
      tags: [Products]
      summary: 启用/停用货物
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusRequest'}}}}
      responses: {'200': {description: OK}}

  /drivers:
    get:
      tags: [Drivers]
      summary: 司机列表
      x-permission: driver:list
      responses: {'200': {description: OK}}
    post:
      tags: [Drivers]
      summary: 新增司机并原子创建或关联合法 DRIVER 账号；新账号需 initialPassword，已存在账号不改密码
      x-permission: driver:add
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DriverCreateRequest'}}}}
      responses: {'200': {description: OK}}
  /drivers/binding-candidates:
    get:
      tags: [Drivers]
      summary: 公司车辆绑定候选司机，仅返回启用的 INTERNAL 司机
      x-permission: driver:bindVehicle
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses: {'200': {description: OK}}
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: 司机详情
      x-permission: driver:list
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [Drivers]
      summary: 编辑司机
      x-permission: driver:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /drivers/{id}/bind-vehicle:
    post:
      tags: [Drivers]
      summary: 绑定公司车辆；OUTSOURCED 后端强制拒绝
      x-permission: driver:bindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/unbind-vehicle:
    post:
      tags: [Drivers]
      summary: 解绑车辆
      x-permission: driver:unbindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/binding-history:
    get:
      tags: [Drivers]
      summary: 司机车辆绑定历史（含操作人手机号）
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /vehicles:
    get:
      tags: [Vehicles]
      summary: 车辆列表
      x-permission: vehicle:list
      responses: {'200': {description: OK}}
    post:
      tags: [Vehicles]
      summary: 新增车辆
      x-permission: vehicle:add
      responses: {'200': {description: OK}}
  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: 车辆详情
      x-permission: vehicle:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [Vehicles]
      summary: 编辑车辆
      x-permission: vehicle:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    delete:
      tags: [Vehicles]
      summary: 删除车辆
      x-permission: vehicle:delete
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /vehicles/{id}/binding-history:
    get:
      tags: [Vehicles]
      summary: 车辆绑定历史
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /vehicles/{id}/trailer-binding-history:
    get:
      tags: [Vehicles]
      summary: 车辆车挂绑定历史（含操作人手机号）
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /trailers:
    get:
      tags: [Trailers]
      summary: 车挂列表
      x-permission: trailer:list
      responses: {'200': {description: OK}}
    post:
      tags: [Trailers]
      summary: 新增车挂
      x-permission: trailer:add
      responses: {'200': {description: OK}}
  /trailers/{id}:
    put:
      tags: [Trailers]
      summary: 编辑车挂
      x-permission: trailer:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /trailers/{id}/bind-vehicle:
    post:
      tags: [Trailers]
      summary: 绑定车辆
      x-permission: trailer:bindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /trailers/{id}/unbind-vehicle:
    post:
      tags: [Trailers]
      summary: 解绑车辆
      x-permission: trailer:unbindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}

  /route-templates:
    get:
      tags: [RouteTemplates]
      summary: 查询最终线路模板
      x-permission: template:view
      responses: {'200': {description: OK}}
    post:
      tags: [RouteTemplates]
      summary: 创建线路模板
      x-permission: template:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteTemplateRequest'}}}}
      responses: {'200': {description: OK}}
  /route-templates/{id}:
    get:
      tags: [RouteTemplates]
      x-permission: template:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    patch:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteTemplateRequest'}}}}
      responses: {'200': {description: OK}}
  /route-templates/{id}/enable:
    post:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /route-templates/{id}/disable:
    post:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /dispatch-batches/preview:
    post:
      tags: [TransportTasks]
      summary: 对全部调度行预校验；失败不产生正式任务
      x-permission: dispatch:batch
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchBatchRequest'}}}}
      responses: {'200': {description: OK}}
  /dispatch-batches/confirm:
    post:
      tags: [TransportTasks]
      summary: 再次全量校验后整批原子发布，requestKey 幂等
      x-permission: dispatch:batch
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchConfirmRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /dispatch-batches/{id}:
    get:
      tags: [TransportTasks]
      x-permission: dispatch:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /task-imports/template:
    get:
      tags: [TaskImports]
      summary: 下载固定版本运输任务 Excel 模板
      x-permission: task:import:view
      responses: {'200': {description: Excel 文件}}
  /task-imports/preview:
    post:
      tags: [TaskImports]
      summary: 上传真实固定模板，保存逐行预览和文件历史；不生成任务
      x-permission: task:import:submit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [requestKey, file]
              properties:
                requestKey: {type: string}
                file: {type: string, format: binary}
      responses: {'200': {description: 逐行预览}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /task-imports/{id}/confirm:
    post:
      tags: [TaskImports]
      summary: 逐行正式重验并发布，每行结果与导入历史持久保存
      x-permission: task:import:submit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 逐行正式结果}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /task-imports:
    get:
      tags: [TaskImports]
      summary: 任务导入历史分页
      x-permission: task:import:view
      responses: {'200': {description: OK}}
  /task-imports/{id}:
    get:
      tags: [TaskImports]
      summary: 查看导入批次与逐行结果
      x-permission: task:import:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /task-imports/{id}/rows:
    get:
      tags: [TaskImports]
      summary: 查看导入逐行结果
      x-permission: task:import:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks:
    get:
      tags: [TransportTasks]
      summary: 管理端任务分页；司机使用专用脱敏接口
      x-permission: task:view
      parameters:
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TaskStatus'}}
        - {name: templateId, in: query, schema: {type: integer, format: int64}}
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: taskNo, in: query, schema: {type: string}}
        - {name: businessDate, in: query, schema: {type: string, format: date}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}:
    get:
      tags: [TransportTasks]
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/participants:
    get:
      tags: [TransportTasks]
      summary: 参与历史；工资字段另需 salary:view
      x-permission: task:participants:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/weight-versions:
    get:
      tags: [TransportTasks]
      x-permission: task:weight:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/transfer:
    post:
      tags: [TransportTasks]
      x-permission: task:transfer
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskTransferRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/depart:
    post:
      tags: [TransportTasks]
      summary: 仅当前参与司机可发车；响应为脱敏 DriverTask
      x-permission: task:depart
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDepartRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/unload:
    post:
      tags: [TransportTasks]
      summary: 仅当前在途司机可卸货；必须有原始磅单
      x-permission: task:unload
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskUnloadRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/cancel:
    post:
      tags: [TransportTasks]
      summary: 仅未实际发车且未进入转派链的任务可取消
      x-permission: task:cancel
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskCancelRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/weight-adjustments:
    post:
      tags: [TransportTasks]
      x-permission: task:weight:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWeightAdjustmentRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/amount-adjustments:
    post:
      tags: [TransportTasks]
      summary: 实际单价或信息费授权调整并追加历史
      x-permission: task:amount:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskAmountAdjustmentRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/amount-history:
    get:
      tags: [TransportTasks]
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/participant-salaries/confirm:
    post:
      tags: [DriverSalaries]
      summary: 按参与人统一核定实际工资并追加调整历史
      x-permission: salary:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSalariesConfirmRequest'}}}}
      responses: {'200': {description: OK}}
  /driver/transport-tasks:
    get:
      tags: [TransportTasks]
      summary: 本人参与任务分页；仅返回脱敏 DriverTask
      x-permission: task:view
      responses: {'200': {description: OK}}
  /driver/transport-tasks/{id}:
    get:
      tags: [TransportTasks]
      summary: 本人参与任务详情；无单价、工资、收入、利润和达标字段
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /driver-salaries:
    get:
      tags: [DriverSalaries]
      summary: Participant 工资台账；服务端筛选与分页
      x-permission: salary:view
      parameters:
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: month, in: query, schema: {type: string}}
        - {name: driverType, in: query, schema: {type: string, enum: [INTERNAL, OUTSOURCED]}}
        - {name: templateId, in: query, schema: {type: integer, format: int64}}
        - {name: taskId, in: query, schema: {type: integer, format: int64}}
        - {name: transferOnly, in: query, schema: {type: boolean}}
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses: {'200': {description: OK}}
  /driver-salaries/summary:
    get:
      tags: [DriverSalaries]
      summary: 与工资台账相同筛选口径的全量汇总
      x-permission: salary:view
      parameters:
        - {name: month, in: query, schema: {type: string}}
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: driverType, in: query, schema: {type: string, enum: [INTERNAL, OUTSOURCED]}}
        - {name: templateId, in: query, schema: {type: integer, format: int64}}
        - {name: taskId, in: query, schema: {type: integer, format: int64}}
        - {name: transferOnly, in: query, schema: {type: boolean}}
      responses: {'200': {description: OK}}
  /driver-salaries/filter-options:
    get:
      tags: [DriverSalaries]
      summary: 工资域司机、模板与任务可搜索筛选选项；无需额外主数据权限
      x-permission: salary:view
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [DRIVER, TEMPLATE, TASK]}}
        - {name: search, in: query, schema: {type: string}}
        - {name: month, in: query, schema: {type: string}}
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
