        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses: {'200': {description: 待归属费用分页与总数}}
  /expense-ledger/pending-attribution/summary:
    get:
      tags: [ExpenseLedger]
      summary: 当前用户有权办理的全部待归属费用数量和金额；不受分页影响
      x-function-any-of: [PAGE_EXPENSE_UNASSIGNED]
      parameters:
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: expenseType, in: query, schema: {type: string}}
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: vehicleId, in: query, schema: {type: integer, format: int64}}
        - {name: sourceType, in: query, schema: {type: string}}
      responses: {'200': {description: 待归属费用 entry_count 与 amount_total}}
  /expense-ledger/export:
    get:
      x-function-any-of: [BUTTON_EXPENSE_LEDGER_EXPORT]
      tags: [ExpenseLedger]
      summary: 与费用台账同筛选口径的完整 Excel 导出
      responses: {'200': {description: Excel 文件, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}}}
  /expense-ledger/{id}:
    get:
      tags: [ExpenseLedger]
      summary: 费用事实、原审批、归属历史、冲销关系及审计
      x-function-any-of: [PAGE_EXPENSE_LEDGER, PAGE_EXPENSE_UNASSIGNED, PAGE_FINANCE_VEHICLES, PAGE_FINANCE_DRIVERS, PAGE_FINANCE_ENERGY]
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 费用详情}}
  /expense-ledger/{id}/attribution:
    post:
      x-function-any-of: [BUTTON_EXPENSE_UNASSIGNED_ATTRIBUTE]
      tags: [ExpenseLedger]
      summary: 有版本校验的费用任务归属调整；车辆必须匹配正式自有参与车辆
      description: 充电来源费用归属任务时同步确定该任务参与司机并记为 ELECTRIC；解除归属时司机清空并记为 TEMP_ELECTRIC。其它费用类型和司机保持原值。
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, expectedVersion], properties: {targetTaskId: {type: integer, format: int64, nullable: true}, reason: {type: string}, expectedVersion: {type: integer}}}}}}
      responses: {'200': {description: 更新后的费用详情}}
  /expense-ledger/{id}/reverse:
    post:
      x-function-any-of: [BUTTON_EXPENSE_LEDGER_REVERSE]
      tags: [ExpenseLedger]
      summary: 保留原费用并建立等额负数冲销事实
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, requestKey], properties: {reason: {type: string}, requestKey: {type: string}}}}}}
      responses: {'200': {description: 原费用及冲销关系}}
  /finance/task-summaries:
    get:
      x-function-any-of: [PAGE_FINANCE_TASKS]
      tags: [Finance]
      summary: 对任务列表批量返回统一财务投影
      parameters: [{name: taskIds, in: query, required: true, schema: {type: array, items: {type: integer, format: int64}}}]
      responses: {'200': {description: 任务经营摘要列表}}
  /finance/tasks:
    get:
      x-function-any-of: [PAGE_FINANCE_TASKS]
      tags: [Finance]
      summary: 已完成运输任务经营分页
      responses: {'200': {description: 任务经营分页}}
  /finance/tasks/{id}:
    get:
      x-function-any-of: [PAGE_FINANCE_TASKS]
      tags: [Finance]
      summary: 任务经营、参与人、归属费用及类型汇总
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 任务经营档案}}
  /transport-tasks/{id}/expenses:
    get:
      x-function-any-of: [PAGE_FINANCE_TASKS]
      tags: [Finance]
      summary: 运输任务当前归属的正式费用清单
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 费用清单}}
  /finance/templates:
    get:
      x-function-any-of: [PAGE_FINANCE_TEMPLATES]
      tags: [Finance]
      summary: 线路模板按所属已完成任务聚合经营
      responses: {'200': {description: 模板经营分页}}
  /finance/company:
    get:
      x-function-any-of: [PAGE_FINANCE_COMPANY]
      tags: [Finance]
      summary: 公司月度总经营，包括未归属任务的正式日常费用
      parameters: [{name: month, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: 月度经营汇总}}
  /finance/dashboard:
    get:
      x-function-any-of: [PAGE_DASHBOARD]
      tags: [Finance]
      summary: 基于同一经营投影的首页看板与待处理计数
      parameters: [{name: month, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: 看板数据}}
  /settlements/{month}/versions:
    get:
      x-function-any-of: [PAGE_SETTLEMENTS]
      tags: [Settlement]
      summary: 某月只读结算版本列表
      parameters: [{name: month, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 版本列表}}
    post:
      x-function-any-of: [BUTTON_SETTLEMENTS_GENERATE]
      tags: [Settlement]
      summary: 使用当前正式财务事实生成不可变的新结算版本
      parameters: [{name: month, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: 新版本摘要}}
  /settlements/versions/{id}:
    get:
      x-function-any-of: [PAGE_SETTLEMENTS]
      tags: [Settlement]
      summary: 只读结算版本摘要
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 版本摘要}}
  /settlements/versions/{id}/details:
    get:
      x-function-any-of: [PAGE_SETTLEMENTS]
      tags: [Settlement]
      summary: 不可变结算事实的服务端分页明细，按快照中的任务完成时间或正式费用入账创建时间倒序、同时间按明细 ID 倒序
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 业务明细}}
  /settlements/versions/{id}/diff:
    get:
      x-function-any-of: [PAGE_SETTLEMENTS]
      tags: [Settlement]
      summary: 与前一版本的业务化差异、金额影响、原因和操作信息；费用审批来源含 approvalId，可按审批详情权限查询
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: 差异分页}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    YearMonth: {name: yearMonth, in: path, required: true, schema: {type: string}}
  responses:
    BusinessConflict:
      description: 业务规则冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
  schemas:
    TireEditRequest:
      type: object
      required: [tireNo, materialDescription, arrivedAt, expectedVersion, reason]
      properties:
        tireNo: {type: string, maxLength: 128}
        barcode: {type: string, maxLength: 128}
        materialDescription: {type: string, maxLength: 1000}
        arrivedAt: {type: string, format: date-time}
        expectedVersion: {type: integer}
        reason: {type: string}
    TireRequestInput:
      type: object
      required: [templateId, requestKey, items]
      properties:
        templateId: {type: integer, format: int64}
        requestKey: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [ocrRecordId, confirmedTireNo]
            properties:
              ocrRecordId: {type: integer, format: int64}
              confirmedTireNo: {type: string, maxLength: 128}
    TireResubmission:
      type: object
      required: [items, expectedVersion]
      properties:
        expectedVersion: {type: integer}
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [ocrRecordId, confirmedTireNo]
            properties:
              ocrRecordId: {type: integer, format: int64}
              confirmedTireNo: {type: string, maxLength: 128}
    ApprovalTemplateInput:
      type: object
      description: 新建仅接受 EXPENSE 或 TIRE_REPLACEMENT。稳定业务编号及模板名称由服务端生成；费用模板名称由正式费用大类生成，同类型同大类只允许一份有效模板。已有 GENERAL 模板仅供历史读取。
      required: [businessType, initiatorRoleIds, nodes]
      properties:
        stableCode: {type: string, readOnly: true}
        name: {type: string, readOnly: true}
        businessType: {type: string, enum: [EXPENSE, TIRE_REPLACEMENT]}
        expenseType: {type: string, nullable: true, description: 费用申请必填，从当前启用的正式费用大类中选择；换胎申请不传}
        initiatorRoleIds: {type: array, items: {type: integer, format: int64}}
        nodes:
          type: array
          items:
            type: object
            required: [name, approverRoleId]
            properties:
              name: {type: string}
              approverRoleId: {type: integer, format: int64}
              approverUserId: {type: integer, format: int64, nullable: true}
              allowReturn: {type: boolean}
    ApprovalExpenseItem:
      type: object
      required: [businessDate, vehicleId, driverId, amount]
      properties:
        businessDate: {type: string, format: date}
        vehicleId: {type: integer, format: int64, description: 电费和临时电费仅 ELECTRIC 车辆；气费和临时气费仅 GAS 车辆，按模板费用大类逐项校验}
        driverId: {type: integer, format: int64}
        targetTaskId: {type: integer, format: int64, nullable: true}
        amount: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        description: {type: string, nullable: true}
        receiptNo: {type: string, nullable: true}
        invoiceNo: {type: string, nullable: true}
        remark: {type: string, nullable: true}
        stationName: {type: string, nullable: true}
        trailerNo: {type: string, maxLength: 64, nullable: true, description: 日常费用可选的车挂号快照，手工与固定 Excel 明细共用}
    ApprovalApplication:
      type: object
      required: [templateId, requestKey]
      properties:
        templateId: {type: integer, format: int64}
        requestKey: {type: string}
        applicationScope: {type: string, enum: [DAILY, TASK], nullable: true}
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}, description: Web DAILY 可多条手工与固定 Excel 混合明细；Web TASK 与小程序 DAILY/TASK 每次各一条}
        generalSnapshot: {type: object, additionalProperties: true}
        tireRequestId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}, description: 本次提交版本的已上传 APPROVAL_APPLICATION 图片 ID；选填，可多张}
    ApprovalAction:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer}
        comment: {type: string}
        targetFlowNodeId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}, description: 本次审批动作的已上传 APPROVAL_ACTION 图片 ID；选填，可多张}
    ApprovalResubmission:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}}
        generalSnapshot: {type: object, additionalProperties: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}, description: 新提交版本的已上传 APPROVAL_APPLICATION 图片 ID；历史版本附件不覆盖}
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, examples: ['0']}
        message: {type: string}
        data: {}
        requestId: {type: string}
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string}
        terminal:
          type: string
          enum: [WEB, MINI]
          default: WEB
          description: 终端类型。管理端传 WEB，微信小程序传 MINI。
    CurrentUser:
      type: object
      description: 当前登录账号、单一角色、权限，以及司机账号的小程序身份扩展信息。
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        role:
          type: object
          properties:
            id: {type: integer, format: int64}
            code: {type: string}
            name: {type: string}
        permissions:
          type: array
          items: {type: string}
        driverId: {type: [integer, 'null'], format: int64}
        driverType: {type: [string, 'null'], enum: [INTERNAL, OUTSOURCED, null]}
        driverName: {type: [string, 'null']}
        currentVehicleId: {type: [integer, 'null'], format: int64}
        currentPlateNo: {type: [string, 'null']}
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: integer, enum: [0, 1]}
    ProductRequest:
      type: object
      required: [name, enabled]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        expectedVersion: {type: [integer, 'null']}
    UserRequest:
      type: object
      required: [phone, roleId, status]
      properties:
        phone: {type: string}
        password: {type: [string, 'null'], minLength: 6, description: 新增账号必填；编辑账号不使用该字段重置密码}
        roleId: {type: integer, format: int64}
        status: {type: integer, enum: [0, 1]}
    RoleRequest:
      type: object
      required: [roleName, status]
      properties:
        roleCode: {type: string, readOnly: true, description: 服务端自动生成且不可修改}
        roleName: {type: string}
        status: {type: integer, enum: [0, 1]}
    RolePermissionRequest:
      type: object
      properties:
        permissionCodes:
          type: array
          items: {$ref: '#/components/schemas/FunctionCode'}
    TaskStatus:
      type: string
      enum: [PUBLISHED, IN_TRANSIT, TRANSFER_PENDING, COMPLETED, CANCELLED]
    AttachmentPurpose:
      type: string
      enum: [WEIGHT_ADJUST, ROUTE_UNLOAD_WEIGHT_TICKET, IMPORT_FILE, TIRE_OCR, APPROVAL_APPLICATION, APPROVAL_ACTION]
    Attachment:
      type: object
      required: [id, ownerType, ownerId, purpose, storageKey, originalFilename, fileSize, fileHash, uploadedBy, uploadedAt]
      properties:
        id: {type: integer, format: int64}
        ownerType: {type: string}
        ownerId: {type: integer, format: int64}
        purpose: {$ref: '#/components/schemas/AttachmentPurpose'}
        originalFilename: {type: string}
        contentType: {type: [string, 'null']}
        fileSize: {type: integer, format: int64}
        fileHash: {type: string}
        storageKey: {type: string}
        uploadedBy: {type: integer, format: int64}
        uploadedAt: {type: string, format: date-time}
    DecimalMoney:
      type: string
      pattern: '^\\d{1,16}(\\.\\d{1,2})?$'
      description: 金额 DECIMAL(18,2)，接口以字符串传输避免浮点误差。
    DecimalWeight:
      type: string
      pattern: '^\\d{1,15}(\\.\\d{1,3})?$'
      description: 重量/电量/气量 DECIMAL(18,3)，接口以字符串传输避免浮点误差。
    DriverCreateRequest:
      type: object
      required: [driverType, name, phone, idCardNo, drivingLicenseNo, status, initialPassword]
      properties:
        driverType: {type: string, enum: [INTERNAL, OUTSOURCED]}
        name: {type: string}
        phone: {type: string}
        status: {type: integer, enum: [0, 1]}
        initialPassword: {type: string, minLength: 6, writeOnly: true, description: 新增司机时必填；同手机号已有任何账号时拒绝创建}
        drivingLicenseNo: {type: string, minLength: 1, description: 司机驾驶证号；首尾空格由服务端去除；全局唯一}
        idCardNo: {type: string, pattern: '^[1-9][0-9]{16}[0-9Xx]$', description: 中国大陆18位身份证；校验出生日期及校验码；全局唯一}
      description: 出生日期与年龄由合法身份证号派生并只读返回，不允许在请求中人工设置。
    VehicleRequest:
      type: object
      required: [plateNo, vehicleLicenseNo, insuranceComplete, energyType, maxLoad, loadStandardType, status]
      properties:
        plateNo: {type: string}
        vehicleLicenseNo: {type: string, minLength: 1, description: 车辆行驶证号；首尾空格由服务端去除；全局唯一}
        insuranceComplete: {type: boolean}
        energyType: {type: string, enum: [ELECTRIC, GAS]}
        maxLoad: {type: string, pattern: '^\d+(\.\d{1,3})?$', description: 大于 0 且最多 3 位小数}
        loadStandardType: {type: string, enum: [PERCENT, FIXED]}
        loadStandardPercent: {type: [number, 'null']}
        loadStandardMinLoad: {type: [string, 'null'], description: FIXED 时必填；大于 0、不超过 maxLoad、最多 3 位小数}
        status: {type: integer, enum: [0, 1]}
    RouteTemplateRequest:
      type: object
      required: [name, customerName, productId, loadingPlace, unloadingPlace, defaultUnitPrice, defaultInformationFee, defaultDriverSalary]
      properties:
        name: {type: string, maxLength: 128}
        customerName: {type: string, maxLength: 128}
        productId: {type: integer, format: int64}
        loadingPlace: {type: string}
        unloadingPlace: {type: string}
        defaultUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
        defaultInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
        defaultDriverSalary: {$ref: '#/components/schemas/DecimalMoney'}
        remark: {type: [string, 'null']}
        expectedVersion: {type: [integer, 'null'], description: 更新时必填}
    DispatchBatchRequest:
      type: object
      required: [businessDate, rows]
      properties:
        businessDate: {type: string, format: date}
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [templateStableCode, driverId]
            properties:
              templateStableCode: {type: string}
              driverId: {type: integer, format: int64}
              outsourcedPlateNo: {type: [string, 'null'], description: 后端确认司机为 OUTSOURCED 时必填}
              actualUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
              actualInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
              initialSalary: {$ref: '#/components/schemas/DecimalMoney'}
              remark: {type: [string, 'null']}
    DispatchConfirmRequest:
      type: object
      required: [previewId, requestKey, batch]
      properties:
        previewId: {type: string}
        requestKey: {type: string}
        batch: {$ref: '#/components/schemas/DispatchBatchRequest'}
    TaskTransferRequest:
      type: object
      required: [newDriverId, allParticipantSalaries, newSalary, reason, expectedVersion, expectedCurrentParticipantId]
      properties:
        newDriverId: {type: integer, format: int64}
        outsourcedPlateNo: {type: [string, 'null']}
        allParticipantSalaries:
          type: array
          items:
            type: object
            required: [participantId, amount]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
        newSalary: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
        expectedVersion: {type: integer}
        expectedCurrentParticipantId: {type: integer, format: int64}
    TaskDepartRequest:
      type: object
      required: [requestKey, expectedVersion]
      properties:
        requestKey: {type: string}
        expectedVersion: {type: integer}
    TaskUnloadRequest:
      type: object
      required: [grossWeight, tareWeight, ticketAttachmentIds, requestKey]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        ticketAttachmentIds: {type: array, minItems: 1, items: {type: integer, format: int64}}
        requestKey: {type: string}
    TaskCancelRequest:
      type: object
      required: [reason, expectedVersion, requestKey]
      properties:
        reason: {type: string}
        expectedVersion: {type: integer}
        requestKey: {type: string}
    TaskWeightAdjustmentRequest:
      type: object
      required: [grossWeight, tareWeight, reason, expectedVersion]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        reason: {type: string}
        evidenceAttachmentIds: {type: array, items: {type: integer, format: int64}}
        expectedVersion: {type: integer}
    TaskAmountAdjustmentRequest:
      type: object
      required: [expectedVersion, amountKind, afterAmount, reason]
      properties:
        expectedVersion: {type: integer}
        amountKind: {type: string, enum: [UNIT_PRICE, INFORMATION_FEE]}
        afterAmount: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
    TaskSalariesConfirmRequest:
      type: object
      required: [salaries, reason, requestKey]
      properties:
        salaries:
          type: array
          items:
            type: object
            required: [participantId, amount, expectedVersion]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
              expectedVersion: {type: integer}
        reason: {type: string}
        requestKey: {type: string}
    FunctionCode:
      type: string
      description: 系统启动从后端功能注册表同步的页面或按钮功能编码。
      enum:
        - PAGE_DASHBOARD
        - PAGE_PRODUCTS
        - PAGE_TEMPLATES
        - PAGE_DISPATCH
        - PAGE_TASK_IMPORTS
        - PAGE_ROUTES
        - PAGE_DISPATCH_INTERNAL
        - PAGE_DISPATCH_OUTSOURCED
        - PAGE_DRIVERS
        - PAGE_VEHICLES
        - PAGE_TRAILERS
        - PAGE_BINDING
        - PAGE_TIRES
        - PAGE_TIRE_IMPORTS
        - PAGE_EXPENSE_APPLY
        - PAGE_EXPENSE_LEDGER
        - PAGE_EXPENSE_UNASSIGNED
        - PAGE_CHARGING_IMPORTS
        - PAGE_CHARGING_COMPANIES
        - PAGE_APPROVALS_TODO
        - PAGE_APPROVALS_MINE
