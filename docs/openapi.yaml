openapi: 3.1.0
info:
  title: Fleet Operations API
  version: 3.0.0
  description: 车队经营管理系统统一 API 契约。详细业务规则以项目需求基线文档为准。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: Auth}
  - {name: Products}
  - {name: Drivers}
  - {name: Vehicles}
  - {name: Trailers}
  - {name: RouteTemplates}
  - {name: TaskImports}
  - {name: Tires}
  - {name: TransportTasks}
  - {name: DriverSalaries}
  - {name: Notifications}
  - {name: Attachments}
  - {name: Approvals}
  - {name: ExpenseApplications}
  - {name: ExpenseLedger}
  - {name: ChargingImports}
  - {name: Finance}
  - {name: Settlement}
  - {name: System}
paths:
  /tires:
    get:
      tags: [Tires]
      summary: 管理端轮胎库存分页查询
      x-function-any-of: [PAGE_TIRES]
      parameters:
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: tireNo, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [AVAILABLE, CLAIMED]}}
      responses: {'200': {description: 轮胎库存与分页信息；已申领轮胎返回申请人和目前所在车辆}}
  /tires/{id}:
    get:
      tags: [Tires]
      summary: 轮胎详情、维护历史及换胎审批链；已申领轮胎显示申请人和目前所在车辆
      x-function-any-of: [PAGE_TIRES]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 轮胎详情；approvalChain 按时间列出各次提交、审批操作与当前待处理节点，包含操作人手机号、角色、时间及意见}}
    patch:
      tags: [Tires]
      summary: 授权维护可用轮胎入库信息并生成历史和审计
      x-function-any-of: [BUTTON_TIRES_MANAGE]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TireEditRequest'}
      responses: {'200': {description: 修改后的轮胎详情}}
  /tires/{id}/history:
    get:
      tags: [Tires]
      summary: 轮胎人工维护与审批生效历史
      x-function-any-of: [PAGE_TIRES]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 轮胎历史列表}}
  /tire-imports/template:
    get:
      tags: [Tires]
      summary: 下载恰好四字段的系统轮胎入库模板
      x-function-any-of: [PAGE_TIRE_IMPORTS]
      responses: {'200': {description: 固定 Excel 模板}}
  /tire-imports/preview:
    post:
      tags: [Tires]
      summary: 只读解析固定 Excel 并逐行预览，不保存文件或导入历史
      description: 到货时间支持 Excel 日期数值单元格，以及带完整年份的短横线、斜线、点号、中文年月日和连续八位数字文本日期；可带时分秒，统一按分钟精度显示。无年份或无效日期逐行报错。
      x-function-any-of: [BUTTON_TIRE_IMPORTS_SUBMIT]
      requestBody:
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses: {'200': {description: 逐行校验结果}}
  /tire-imports/confirm:
    post:
      tags: [Tires]
      summary: 重新提交 Excel，正式重验并逐行入库；此时才保存原文件和历史
      x-function-any-of: [BUTTON_TIRE_IMPORTS_SUBMIT]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [requestKey, file], properties: {requestKey: {type: string}, file: {type: string, format: binary}}}
      responses: {'200': {description: 逐行入库结果}}
  /tire-imports:
    get:
      tags: [Tires]
      summary: 轮胎入库历史
      x-function-any-of: [PAGE_TIRE_IMPORTS]
      responses: {'200': {description: 分页历史}}
  /tire-imports/{id}:
    get:
      tags: [Tires]
      summary: 轮胎导入逐行详情
      x-function-any-of: [PAGE_TIRE_IMPORTS]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 导入详情}}
  /tire-requests/ocr:
    post:
      tags: [Tires]
      summary: 对本人上传的换胎照片 OCR 并保存原始结果
      x-function-any-of: [BUTTON_MINI_TIRE_REQUEST_SUBMIT]
      responses: {'200': {description: OCR 候选与原始记录}}
  /tire-requests/ocr/{id}/confirm:
    post:
      tags: [Tires]
      summary: 确认本人照片的胎号
      x-function-any-of: [BUTTON_MINI_TIRE_REQUEST_SUBMIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 已确认 OCR 记录}}
  /tires/request-target:
    get:
      tags: [Tires]
      summary: 按确认胎号匹配可用库存
      x-function-any-of: [PAGE_MINI_TIRE_REQUEST]
      responses: {'200': {description: 可用轮胎}}
  /tire-requests/validate:
    post:
      tags: [Tires]
      summary: 逐项校验换胎草稿的库存、待审批状态和批内重复；不创建申请
      x-function-any-of: [BUTTON_MINI_TIRE_REQUEST_SUBMIT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TireRequestInput'}
      responses: {'200': {description: 每项有效状态及具体错误原因}}
  /tire-requests:
    post:
      tags: [Tires]
      summary: 司机端一次提交一至二十条换胎明细并进入同一个 TIRE_REPLACEMENT 审批
      description: 服务端重验全部照片及胎号，任一失败不创建审批；审批通过整批原子申领。使用当前有效的换胎审批模板及其冻结流程版本。
      x-function-any-of: [BUTTON_MINI_TIRE_REQUEST_SUBMIT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TireRequestInput'}
      responses: {'200': {description: 审批实例详情}}
  /tire-requests/approvals/{id}/resubmit:
    post:
      tags: [Tires]
      summary: 被打回的原申请人重新上传照片并核对胎号后在原审批实例重新提交
      description: 每条保留的胎号必须使用新上传且未关联过提交版本的照片；重新校验胎号与库存，形成新 Submission Version，既有审批动作保留；通过后仅当前批次生效。
      x-function-any-of: [BUTTON_MINI_TIRE_REQUEST_SUBMIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TireResubmission'}}}}
      responses: {'200': {description: 更新后的原审批实例详情}}
  /tire-requests/{id}:
    get:
      tags: [Tires]
      summary: 查看本人换胎申请或授权管理端记录
      x-function-any-of: [PAGE_MINI_TIRE_REQUEST, PAGE_APPROVALS_TODO, PAGE_APPROVALS_HISTORY]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: 换胎申请业务事实与原图引用}}
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 手机号密码登录并创建持久化会话
      description: WEB 会话有效期 7 天，MINI 会话有效期 30 天。服务端仅保存 Token 摘要；重启后可从数据库恢复未到期、未撤销的会话，并按最新用户、角色及司机状态重新校验。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
        '409': {description: 用户或所属角色停用时拒绝登录，角色停用返回 AUTH_006}
  /system/ping:
    get:
      x-self-access: true
      tags: [System]
      security: []
      summary: 服务健康探测
      responses: {'200': {description: OK}}
  /auth/logout:
    post:
      x-self-access: true
      tags: [Auth]
      summary: 撤销当前终端的服务端会话
      responses: {'200': {description: OK}}
  /me:
    get:
      x-self-access: true
      tags: [Auth]
      summary: 当前账号、角色、权限、小程序能力
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CurrentUser'}
  /auth/password:
    put:
      x-self-access: true
      tags: [Auth]
      summary: 修改本人密码
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [oldPassword, newPassword], properties: {oldPassword: {type: string}, newPassword: {type: string, minLength: 6}}}}}}
      responses: {'200': {description: OK}}
  /users/{id}/reset-password:
    post:
      tags: [Auth]
      summary: 管理员重置密码
      x-function-any-of: [BUTTON_USERS_RESET_PASSWORD, BUTTON_DRIVERS_RESET_PASSWORD]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [newPassword], properties: {newPassword: {type: string, minLength: 6}}}}}}
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /users/{id}/status:
    put:
      tags: [Auth]
      summary: 启用/停用账号
      x-function-any-of: [BUTTON_USERS_EDIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /users:
    get:
      tags: [System]
      summary: 用户分页列表
      x-function-any-of: [PAGE_USERS]
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增账号并分配单一非 DRIVER 角色；DRIVER 只能由司机业务流程创建或关联
      x-function-any-of: [BUTTON_USERS_ADD]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /users/{id}:
    get:
      tags: [System]
      summary: 用户详情
      x-function-any-of: [PAGE_USERS]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑非 DRIVER 账号并保持单一角色；不可借此修改现有 DRIVER 账号或分配 DRIVER
      x-function-any-of: [BUTTON_USERS_EDIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles:
    get:
      tags: [System]
      summary: 角色分页列表
      x-function-any-of: [PAGE_ROLES]
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增角色
      x-function-any-of: [BUTTON_ROLES_ADD]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}:
    get:
      tags: [System]
      summary: 角色详情
      x-function-any-of: [PAGE_ROLES]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑角色
      x-function-any-of: [BUTTON_ROLES_EDIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}/status:
    put:
      tags: [System]
      summary: 启用/停用角色；停用后所属用户不可登录且已有令牌失效
      x-function-any-of: [BUTTON_ROLES_EDIT]
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: status, in: query, required: true, schema: {type: integer, enum: [0, 1]}}
      responses: {'200': {description: OK}}
  /roles/{id}/permissions:
    put:
      tags: [System]
      summary: 保存角色权限；权限码只能来自既定注册表
      x-function-any-of: [BUTTON_ROLES_GRANT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissionRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /permissions:
    get:
      tags: [System]
      summary: 页面与按钮功能目录，支持按 PAGE/BUTTON 分类
      x-function-any-of: [PAGE_ROLES]
      parameters:
        - {name: permissionType, in: query, required: false, schema: {type: string, enum: [PAGE, BUTTON]}}
      responses: {'200': {description: OK}}
  /audit-logs:
    get:
      tags: [System]
      summary: 操作日志分页查询
      x-function-any-of: [PAGE_AUDIT]
      parameters:
        - {name: module, in: query, required: false, schema: {type: string}}
        - {name: businessType, in: query, required: false, schema: {type: string}}
        - {name: operatorId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: startTime, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: endTime, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK}}

  /products:
    get:
      tags: [Products]
      summary: 货物分页列表
      x-function-any-of: [PAGE_PRODUCTS, PAGE_TEMPLATES]
      responses: {'200': {description: OK}}
    post:
      tags: [Products]
      summary: 新增货物
      x-function-any-of: [BUTTON_PRODUCTS_MANAGE]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /products/{id}:
    put:
      tags: [Products]
      summary: 编辑货物
      x-function-any-of: [BUTTON_PRODUCTS_MANAGE]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}}
  /products/{id}/status:
    put:
      tags: [Products]
      summary: 启用/停用货物
      x-function-any-of: [BUTTON_PRODUCTS_MANAGE]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusRequest'}}}}
      responses: {'200': {description: OK}}

  /drivers:
    get:
      tags: [Drivers]
      summary: 司机列表，含当前车辆及该车辆当前车挂
      x-function-any-of: [PAGE_DRIVERS]
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: keyword, in: query, required: false, description: 司机姓名或手机号模糊查询, schema: {type: string}}
        - {name: driverType, in: query, required: false, schema: {type: string, enum: [INTERNAL, OUTSOURCED]}}
        - {name: status, in: query, required: false, schema: {type: integer, enum: [0, 1]}}
      responses: {'200': {description: OK}}
    post:
      tags: [Drivers]
      summary: 新增司机并原子创建 DRIVER 账号；initialPassword 必填，同手机号已有账号时拒绝且整体回滚
      x-function-any-of: [BUTTON_DRIVERS_ADD]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DriverCreateRequest'}}}}
      responses: {'200': {description: OK}}
  /driver-vehicle-imports/template:
    get:
      tags: [Drivers]
      summary: 下载自有司机和公司车辆初始导入固定十列 xlsx 模板
      x-function-any-of: [PAGE_DRIVERS]
      responses:
        '200': {description: xlsx 模板, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}}
  /driver-vehicle-imports/preview:
    post:
      tags: [Drivers]
      summary: 只读预览全部行；不创建司机、账号、车辆或绑定
      x-function-any-of: [PAGE_DRIVERS]
      x-function-read-only-post: true
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {'200': {description: 包含原始 Excel 行号、逐字段错误和总数的预览；不返回初始密码或完整证件号}}
  /driver-vehicle-imports/confirm:
    post:
      tags: [Drivers]
      summary: 重新解析并校验同一文件；自有司机、账号、公司车和绑定历史整批事务入库
      x-function-any-of: [BUTTON_DRIVERS_IMPORT]
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses: {'200': {description: 整批导入数量；任一行冲突则无业务数据写入}}
  /drivers/binding-candidates:
    get:
      tags: [Drivers]
      summary: 公司车辆绑定候选司机，仅返回启用的 INTERNAL 司机及绑定所需字段，不含身份证和驾驶证号
      x-function-any-of: [PAGE_BINDING]
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses: {'200': {description: OK}}
  /bindings/vehicle-options:
    get:
      tags: [Vehicles]
      summary: 绑定关系页的精简车辆候选；司机绑定时可仅列出启用且未绑定司机的车辆，不返回行驶证号或保险资料
      x-function-any-of: [PAGE_BINDING]
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: onlyUnboundDriver, in: query, required: false, schema: {type: boolean, default: false}, description: true 时仅返回启用且没有当前司机绑定的车辆}
      responses: {'200': {description: 车辆及当前车挂的分页选择项}}
  /bindings/trailer-options:
    get:
      tags: [Trailers]
      summary: 绑定关系页的精简车挂候选；车辆绑定时可仅列出启用且未绑定车辆的车挂
      x-function-any-of: [PAGE_BINDING]
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
        - {name: onlyUnboundVehicle, in: query, required: false, schema: {type: boolean, default: false}, description: true 时仅返回启用且没有当前车辆绑定的车挂}
      responses: {'200': {description: 车挂及当前车辆的分页选择项}}
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: 司机详情，含当前车辆及该车辆当前车挂
      x-function-any-of: [PAGE_DRIVERS]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [Drivers]
      summary: 编辑司机；停用时无未完成任务才允许，并在同一事务解除当前车辆绑定及记录历史
      x-function-any-of: [BUTTON_DRIVERS_EDIT]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DriverCreateRequest'}}}}
      responses: {'200': {description: OK}}
  /drivers/{id}/bind-vehicle:
    post:
      tags: [Drivers]
      summary: 绑定启用的公司车辆；停用车辆及 OUTSOURCED 司机由后端拒绝
      x-function-any-of: [BUTTON_BINDING_BIND_DRIVER]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/unbind-vehicle:
    post:
      tags: [Drivers]
      summary: 解绑司机车辆；当前司机有待发车、待接手或在途任务时拒绝并提示先联系调度处理
      x-function-any-of: [BUTTON_BINDING_UNBIND_DRIVER]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/binding-history:
    get:
      tags: [Drivers]
      summary: 司机车辆绑定历史（含操作人手机号）
