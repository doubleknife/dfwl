openapi: 3.1.0
info:
  title: Fleet Operations API
  version: 3.0.0
  description: 车队经营管理系统统一 API 契约。详细业务规则以项目需求基线文档为准。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: Auth}
  - {name: Products}
  - {name: Drivers}
  - {name: Vehicles}
  - {name: Trailers}
  - {name: RouteTemplates}
  - {name: TransportTasks}
  - {name: DriverSalaries}
  - {name: Notifications}
  - {name: Attachments}
  - {name: System}
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 手机号密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ApiResponse'}}}}
  /system/ping:
    get:
      tags: [System]
      security: []
      summary: 服务健康探测
      responses: {'200': {description: OK}}
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses: {'200': {description: OK}}
  /me:
    get:
      tags: [Auth]
      summary: 当前账号、角色、权限、小程序能力
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CurrentUser'}
  /auth/password:
    put:
      tags: [Auth]
      summary: 修改本人密码
      responses: {'200': {description: OK}}
  /users/{id}/reset-password:
    post:
      tags: [Auth]
      summary: 管理员重置密码
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /users/{id}/status:
    put:
      tags: [Auth]
      summary: 启用/停用账号
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /users:
    get:
      tags: [System]
      summary: 用户分页列表
      x-permission: user:manage
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增账号并分配单一非 DRIVER 角色；DRIVER 只能由司机业务流程创建或关联
      x-permission: user:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /users/{id}:
    get:
      tags: [System]
      summary: 用户详情
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑非 DRIVER 账号并保持单一角色；不可借此修改现有 DRIVER 账号或分配 DRIVER
      x-permission: user:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UserRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles:
    get:
      tags: [System]
      summary: 角色分页列表
      x-permission: role:manage
      responses: {'200': {description: OK}}
    post:
      tags: [System]
      summary: 新增角色
      x-permission: role:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}:
    get:
      tags: [System]
      summary: 角色详情
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [System]
      summary: 编辑角色
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RoleRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /roles/{id}/status:
    put:
      tags: [System]
      summary: 启用/停用角色
      x-permission: role:manage
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {name: status, in: query, required: true, schema: {type: integer, enum: [0, 1]}}
      responses: {'200': {description: OK}}
  /roles/{id}/permissions:
    put:
      tags: [System]
      summary: 保存角色权限；权限码只能来自既定注册表
      x-permission: role:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RolePermissionRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /permissions:
    get:
      tags: [System]
      summary: 权限列表，支持按 MENU/BUTTON/API/MINI_PROGRAM 分类
      x-permission: permission:manage
      parameters:
        - {name: permissionType, in: query, required: false, schema: {type: string, enum: [MENU, BUTTON, API, MINI_PROGRAM]}}
      responses: {'200': {description: OK}}
  /audit-logs:
    get:
      tags: [System]
      summary: 操作日志分页查询
      x-permission: audit:view
      parameters:
        - {name: module, in: query, required: false, schema: {type: string}}
        - {name: businessType, in: query, required: false, schema: {type: string}}
        - {name: operatorId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: startTime, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: endTime, in: query, required: false, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK}}

  /products:
    get:
      tags: [Products]
      summary: 货物分页列表
      x-permission: template:view
      responses: {'200': {description: OK}}
    post:
      tags: [Products]
      summary: 新增货物
      x-permission: template:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /products/{id}:
    put:
      tags: [Products]
      summary: 编辑货物
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductRequest'}}}}
      responses: {'200': {description: OK}}
  /products/{id}/status:
    put:
      tags: [Products]
      summary: 启用/停用货物
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StatusRequest'}}}}
      responses: {'200': {description: OK}}

  /drivers:
    get:
      tags: [Drivers]
      summary: 司机列表
      x-permission: driver:list
      responses: {'200': {description: OK}}
    post:
      tags: [Drivers]
      summary: 新增司机并原子创建或关联合法 DRIVER 账号；新账号需 initialPassword，已存在账号不改密码
      x-permission: driver:add
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DriverCreateRequest'}}}}
      responses: {'200': {description: OK}}
  /drivers/binding-candidates:
    get:
      tags: [Drivers]
      summary: 公司车辆绑定候选司机，仅返回启用的 INTERNAL 司机
      x-permission: driver:bindVehicle
      parameters:
        - {name: pageNo, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses: {'200': {description: OK}}
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: 司机详情
      x-permission: driver:list
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [Drivers]
      summary: 编辑司机
      x-permission: driver:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /drivers/{id}/bind-vehicle:
    post:
      tags: [Drivers]
      summary: 绑定公司车辆；OUTSOURCED 后端强制拒绝
      x-permission: driver:bindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/unbind-vehicle:
    post:
      tags: [Drivers]
      summary: 解绑车辆
      x-permission: driver:unbindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /drivers/{id}/binding-history:
    get:
      tags: [Drivers]
      summary: 司机车辆绑定历史（含操作人手机号）
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /vehicles:
    get:
      tags: [Vehicles]
      summary: 车辆列表
      x-permission: vehicle:list
      responses: {'200': {description: OK}}
    post:
      tags: [Vehicles]
      summary: 新增车辆
      x-permission: vehicle:add
      responses: {'200': {description: OK}}
  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: 车辆详情
      x-permission: vehicle:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    put:
      tags: [Vehicles]
      summary: 编辑车辆
      x-permission: vehicle:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    delete:
      tags: [Vehicles]
      summary: 删除车辆
      x-permission: vehicle:delete
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /vehicles/{id}/binding-history:
    get:
      tags: [Vehicles]
      summary: 车辆绑定历史
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /vehicles/{id}/trailer-binding-history:
    get:
      tags: [Vehicles]
      summary: 车辆车挂绑定历史（含操作人手机号）
      x-permission: vehicle:bindingHistory
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}

  /trailers:
    get:
      tags: [Trailers]
      summary: 车挂列表
      x-permission: trailer:list
      responses: {'200': {description: OK}}
    post:
      tags: [Trailers]
      summary: 新增车挂
      x-permission: trailer:add
      responses: {'200': {description: OK}}
  /trailers/{id}:
    put:
      tags: [Trailers]
      summary: 编辑车挂
      x-permission: trailer:edit
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /trailers/{id}/bind-vehicle:
    post:
      tags: [Trailers]
      summary: 绑定车辆
      x-permission: trailer:bindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /trailers/{id}/unbind-vehicle:
    post:
      tags: [Trailers]
      summary: 解绑车辆
      x-permission: trailer:unbindVehicle
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}

  /route-templates:
    get:
      tags: [RouteTemplates]
      summary: 查询最终线路模板
      x-permission: template:view
      responses: {'200': {description: OK}}
    post:
      tags: [RouteTemplates]
      summary: 创建线路模板
      x-permission: template:manage
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteTemplateRequest'}}}}
      responses: {'200': {description: OK}}
  /route-templates/{id}:
    get:
      tags: [RouteTemplates]
      x-permission: template:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
    patch:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteTemplateRequest'}}}}
      responses: {'200': {description: OK}}
  /route-templates/{id}/enable:
    post:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /route-templates/{id}/disable:
    post:
      tags: [RouteTemplates]
      x-permission: template:manage
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /dispatch-batches/preview:
    post:
      tags: [TransportTasks]
      summary: 对全部调度行预校验；失败不产生正式任务
      x-permission: task:create
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchBatchRequest'}}}}
      responses: {'200': {description: OK}}
  /dispatch-batches/confirm:
    post:
      tags: [TransportTasks]
      summary: 再次全量校验后整批原子发布，requestKey 幂等
      x-permission: task:publish
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DispatchConfirmRequest'}}}}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/BusinessConflict'}}
  /dispatch-batches/{id}:
    get:
      tags: [TransportTasks]
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks:
    get:
      tags: [TransportTasks]
      summary: 管理端任务分页；司机使用专用脱敏接口
      x-permission: task:view
      parameters:
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/TaskStatus'}}
        - {name: templateId, in: query, schema: {type: integer, format: int64}}
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: taskNo, in: query, schema: {type: string}}
        - {name: businessDate, in: query, schema: {type: string, format: date}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}:
    get:
      tags: [TransportTasks]
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/participants:
    get:
      tags: [TransportTasks]
      summary: 参与历史；工资字段另需 salary:view
      x-permission: task:participants:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/weight-versions:
    get:
      tags: [TransportTasks]
      x-permission: task:weight:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/transfer:
    post:
      tags: [TransportTasks]
      x-permission: task:transfer
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskTransferRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/depart:
    post:
      tags: [TransportTasks]
      summary: 仅当前参与司机可发车；响应为脱敏 DriverTask
      x-permission: task:depart
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskDepartRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/unload:
    post:
      tags: [TransportTasks]
      summary: 仅当前在途司机可卸货；必须有原始磅单
      x-permission: task:unload
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskUnloadRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/cancel:
    post:
      tags: [TransportTasks]
      summary: 仅未实际发车且未进入转派链的任务可取消
      x-permission: task:cancel
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskCancelRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/weight-adjustments:
    post:
      tags: [TransportTasks]
      x-permission: task:weight:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskWeightAdjustmentRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/amount-adjustments:
    post:
      tags: [TransportTasks]
      summary: 实际单价或信息费授权调整并追加历史
      x-permission: task:amount:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskAmountAdjustmentRequest'}}}}
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/amount-history:
    get:
      tags: [TransportTasks]
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /transport-tasks/{id}/participant-salaries/confirm:
    post:
      tags: [DriverSalaries]
      summary: 按参与人统一核定实际工资并追加调整历史
      x-permission: salary:adjust
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaskSalariesConfirmRequest'}}}}
      responses: {'200': {description: OK}}
  /driver/transport-tasks:
    get:
      tags: [TransportTasks]
      summary: 本人参与任务分页；仅返回脱敏 DriverTask
      x-permission: task:view
      responses: {'200': {description: OK}}
  /driver/transport-tasks/{id}:
    get:
      tags: [TransportTasks]
      summary: 本人参与任务详情；无单价、工资、收入、利润和达标字段
      x-permission: task:view
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: OK}}
  /driver-salaries:
    get:
      tags: [DriverSalaries]
      summary: 管理端只读 Participant 工资台账
      x-permission: salary:view
      parameters:
        - {name: driverId, in: query, schema: {type: integer, format: int64}}
        - {name: month, in: query, schema: {type: string}}
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses: {'200': {description: OK}}
  /driver-salaries/{participantId}/history:
    get:
      tags: [DriverSalaries]
      summary: 指定 Participant 工资调整历史
      x-permission: salary:view
      parameters:
        - {name: participantId, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: OK}}
  /salary-slips/mine:
    get:
      tags: [DriverSalaries]
      summary: 自有司机本人月工资摘要和参与明细；外协拒绝
      x-permission: salary:mine
      parameters:
        - {name: month, in: query, required: true, schema: {type: string}}
        - {name: pageNo, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses: {'200': {description: OK}}
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: 当前用户站内通知未读数
      responses: {'200': {description: 返回 data.unreadCount}}
  /notifications:
    get:
      tags: [Notifications]
      summary: 当前用户站内通知分页
      parameters:
        - {name: pageNo, in: query, schema: {type: integer, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, default: 20, maximum: 100}}
      responses: {'200': {description: 仅返回当前用户的通知；包含 businessType/businessId 用于受授权业务导航}}
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: 将当前用户的一条通知标记已读
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses: {'200': {description: 返回最新未读数}}
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: 将当前用户全部通知标记已读
      responses: {'200': {description: 返回最新未读数}}

  /attachments:
    get:
      tags: [Attachments]
      summary: 按 ownerType/ownerId/purpose 查询附件元数据
      description: 任务证据读取权限由后端根据 owner_type、owner_id、purpose 和参与范围校验；司机可读取原始卸货磅单，重量纠错证据仅授权管理人员可见。
      parameters:
        - {name: ownerType, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: ownerId, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: purpose, in: query, required: false, schema: {$ref: '#/components/schemas/AttachmentPurpose'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Attachment'}
    post:
      tags: [Attachments]
      summary: 上传原始文件
      description: 当前仅允许 TASK 的原始卸货磅单与重量纠错证据上传；每次上传生成独立附件，后端按任务归属和权限校验。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ownerType, ownerId, purpose, file]
              properties:
                ownerType: {type: string, maxLength: 64}
                ownerId: {type: integer, format: int64}
                purpose: {$ref: '#/components/schemas/AttachmentPurpose'}
                file: {type: string, format: binary}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiResponse'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Attachment'}
        '409': {$ref: '#/components/responses/BusinessConflict'}
  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: 读取附件原始文件
      description: 必须认证；后端根据附件 owner_type、owner_id、purpose 做权限和业务归属检查，禁止猜测 ID 读取无关附件。司机可按线路参与范围读取原始卸货磅单，但不可读取 WEIGHT_ADJUST 纠错附件。
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200':
          description: 原始文件内容
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '409': {$ref: '#/components/responses/BusinessConflict'}
    delete:
      tags: [Attachments]
      summary: 普通删除入口
      description: 当前实现统一拒绝普通附件删除，避免破坏任务证据和审计历史。
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '409': {$ref: '#/components/responses/BusinessConflict'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    YearMonth: {name: yearMonth, in: path, required: true, schema: {type: string, pattern: '^\\d{4}-\\d{2}$'}}
  responses:
    BusinessConflict:
      description: 业务规则冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, examples: ['0']}
        message: {type: string}
        data: {}
        requestId: {type: string}
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string}
    CurrentUser:
      type: object
      description: 当前登录账号、单一角色、权限，以及司机账号的小程序身份扩展信息。
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        role:
          type: object
          properties:
            id: {type: integer, format: int64}
            code: {type: string}
            name: {type: string}
        permissions:
          type: array
          items: {type: string}
        driverId: {type: [integer, 'null'], format: int64}
        driverType: {type: [string, 'null'], enum: [INTERNAL, OUTSOURCED, null]}
        driverName: {type: [string, 'null']}
        currentVehicleId: {type: [integer, 'null'], format: int64}
        currentPlateNo: {type: [string, 'null']}
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: integer, enum: [0, 1]}
    ProductRequest:
      type: object
      required: [name, enabled]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        expectedVersion: {type: [integer, 'null']}
    UserRequest:
      type: object
      required: [phone, roleId, status]
      properties:
        phone: {type: string}
        password: {type: [string, 'null'], description: 新增账号必填；编辑账号不使用该字段重置密码}
        roleId: {type: integer, format: int64}
        status: {type: integer, enum: [0, 1]}
    RoleRequest:
      type: object
      required: [roleCode, roleName, status]
      properties:
        roleCode: {type: string}
        roleName: {type: string}
        status: {type: integer, enum: [0, 1]}
    RolePermissionRequest:
      type: object
      properties:
        permissionCodes:
          type: array
          items: {$ref: '#/components/schemas/PermissionCode'}
    TaskStatus:
      type: string
      enum: [UNPUBLISHED, PUBLISHED, IN_TRANSIT, TRANSFER_PENDING, COMPLETED, CANCELLED]
    AttachmentPurpose:
      type: string
      enum: [WEIGHT_ADJUST, ROUTE_UNLOAD_WEIGHT_TICKET]
    Attachment:
      type: object
      required: [id, ownerType, ownerId, purpose, storageKey, originalFilename, fileSize, fileHash, uploadedBy, uploadedAt]
      properties:
        id: {type: integer, format: int64}
        ownerType: {type: string}
        ownerId: {type: integer, format: int64}
        purpose: {$ref: '#/components/schemas/AttachmentPurpose'}
        originalFilename: {type: string}
        contentType: {type: [string, 'null']}
        fileSize: {type: integer, format: int64}
        fileHash: {type: string}
        storageKey: {type: string}
        uploadedBy: {type: integer, format: int64}
        uploadedAt: {type: string, format: date-time}
    DecimalMoney:
      type: string
      pattern: '^\\d{1,16}(\\.\\d{1,2})?$'
      description: 金额 DECIMAL(18,2)，接口以字符串传输避免浮点误差。
    DecimalWeight:
      type: string
      pattern: '^\\d{1,15}(\\.\\d{1,3})?$'
      description: 重量/电量/气量 DECIMAL(18,3)，接口以字符串传输避免浮点误差。
    DriverCreateRequest:
      type: object
      required: [driverType, name, phone, status]
      properties:
        driverType: {type: string, enum: [INTERNAL, OUTSOURCED]}
        name: {type: string}
        phone: {type: string}
        status: {type: integer, enum: [0, 1]}
        initialPassword: {type: [string, 'null'], writeOnly: true, description: 仅新建 DRIVER User 时必填；已有合法账号时不改原密码}
        vehicleLicenseNo: {type: [string, 'null']}
        drivingLicenseNo: {type: [string, 'null']}
        idCardNo: {type: [string, 'null']}
        birthDate: {type: [string, 'null'], format: date}
    RouteTemplateRequest:
      type: object
      required: [stableCode, name, customerName, productId, loadingPlace, unloadingPlace, defaultUnitPrice, defaultInformationFee, defaultDriverSalary]
      properties:
        stableCode: {type: string, maxLength: 64}
        name: {type: string, maxLength: 128}
        customerName: {type: string, maxLength: 128}
        productId: {type: integer, format: int64}
        loadingPlace: {type: string}
        unloadingPlace: {type: string}
        defaultUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
        defaultInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
        defaultDriverSalary: {$ref: '#/components/schemas/DecimalMoney'}
        remark: {type: [string, 'null']}
        expectedVersion: {type: [integer, 'null'], description: 更新时必填}
    DispatchBatchRequest:
      type: object
      required: [businessDate, rows]
      properties:
        businessDate: {type: string, format: date}
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [templateStableCode, driverId]
            properties:
              templateStableCode: {type: string}
              driverId: {type: integer, format: int64}
              outsourcedPlateNo: {type: [string, 'null'], description: 后端确认司机为 OUTSOURCED 时必填}
              actualUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
              actualInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
              initialSalary: {$ref: '#/components/schemas/DecimalMoney'}
              remark: {type: [string, 'null']}
    DispatchConfirmRequest:
      type: object
      required: [previewId, requestKey, batch]
      properties:
        previewId: {type: string}
        requestKey: {type: string}
        batch: {$ref: '#/components/schemas/DispatchBatchRequest'}
    TaskTransferRequest:
      type: object
      required: [newDriverId, allParticipantSalaries, newSalary, reason, expectedVersion, expectedCurrentParticipantId]
      properties:
        newDriverId: {type: integer, format: int64}
        outsourcedPlateNo: {type: [string, 'null']}
        allParticipantSalaries:
          type: array
          items:
            type: object
            required: [participantId, amount]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
        newSalary: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
        expectedVersion: {type: integer}
        expectedCurrentParticipantId: {type: integer, format: int64}
    TaskDepartRequest:
      type: object
      required: [requestKey, expectedVersion]
      properties:
        requestKey: {type: string}
        expectedVersion: {type: integer}
    TaskUnloadRequest:
      type: object
      required: [grossWeight, tareWeight, ticketAttachmentIds, requestKey]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        ticketAttachmentIds: {type: array, minItems: 1, items: {type: integer, format: int64}}
        requestKey: {type: string}
    TaskCancelRequest:
      type: object
      required: [reason, expectedVersion, requestKey]
      properties:
        reason: {type: string}
        expectedVersion: {type: integer}
        requestKey: {type: string}
    TaskWeightAdjustmentRequest:
      type: object
      required: [grossWeight, tareWeight, reason, expectedVersion]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        reason: {type: string}
        evidenceAttachmentIds: {type: array, items: {type: integer, format: int64}}
        expectedVersion: {type: integer}
    TaskAmountAdjustmentRequest:
      type: object
      required: [expectedVersion, amountKind, afterAmount, reason]
      properties:
        expectedVersion: {type: integer}
        amountKind: {type: string, enum: [UNIT_PRICE, INFORMATION_FEE]}
        afterAmount: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
    TaskSalariesConfirmRequest:
      type: object
      required: [salaries, reason, requestKey]
      properties:
        salaries:
          type: array
          items:
            type: object
            required: [participantId, amount, expectedVersion]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
              expectedVersion: {type: integer}
        reason: {type: string}
        requestKey: {type: string}
    PermissionCode:
      type: string
      enum:
        - vehicle:list
        - vehicle:add
        - vehicle:view
        - vehicle:edit
        - vehicle:delete
        - vehicle:bindDriver
        - vehicle:unbindDriver
        - vehicle:bindingHistory
        - trailer:list
        - trailer:add
        - trailer:edit
        - trailer:bindVehicle
        - trailer:unbindVehicle
        - trailer:bindingHistory
        - driver:list
        - driver:add
        - driver:edit
        - driver:bindVehicle
        - driver:unbindVehicle
        - driver:resetPassword
        - template:view
        - template:manage
        - task:view
        - task:participants:view
        - task:weight:view
        - task:create
        - task:publish
        - task:cancel
        - task:transfer
        - task:depart
        - task:unload
        - task:weight:adjust
        - task:amount:adjust
        - salary:view
        - salary:adjust
        - salary:mine
        - user:manage
        - role:manage
        - permission:manage
        - audit:view
