components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    YearMonth: {name: yearMonth, in: path, required: true, schema: {type: string}}
  responses:
    BusinessConflict:
      description: 业务规则冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiResponse'}
  schemas:
    TireEditRequest:
      type: object
      required: [tireNo, materialDescription, arrivedAt, expectedVersion, reason]
      properties:
        tireNo: {type: string, maxLength: 128}
        barcode: {type: string, maxLength: 128}
        materialDescription: {type: string, maxLength: 1000}
        arrivedAt: {type: string, format: date-time}
        expectedVersion: {type: integer}
        reason: {type: string}
    TireRequestInput:
      type: object
      required: [templateId, ocrRecordId, confirmedTireNo, requestKey]
      properties:
        templateId: {type: integer, format: int64}
        ocrRecordId: {type: integer, format: int64}
        confirmedTireNo: {type: string}
        requestKey: {type: string}
    ApprovalTemplateInput:
      type: object
      description: 新建仅接受 EXPENSE 或 TIRE_REPLACEMENT。稳定业务编号及模板名称由服务端生成；费用模板名称由正式费用大类生成，同类型同大类只允许一份有效模板。已有 GENERAL 模板仅供历史读取。
      required: [businessType, initiatorRoleIds, nodes]
      properties:
        stableCode: {type: string, readOnly: true}
        name: {type: string, readOnly: true}
        businessType: {type: string, enum: [EXPENSE, TIRE_REPLACEMENT]}
        expenseType: {type: string, nullable: true, description: 费用申请必填，从当前启用的正式费用大类中选择；换胎申请不传}
        initiatorRoleIds: {type: array, items: {type: integer, format: int64}}
        nodes:
          type: array
          items:
            type: object
            required: [name, approverRoleId]
            properties:
              name: {type: string}
              approverRoleId: {type: integer, format: int64}
              approverUserId: {type: integer, format: int64, nullable: true}
              allowReturn: {type: boolean}
    ApprovalExpenseItem:
      type: object
      required: [businessDate, vehicleId, driverId, amount]
      properties:
        businessDate: {type: string, format: date}
        vehicleId: {type: integer, format: int64}
        driverId: {type: integer, format: int64}
        targetTaskId: {type: integer, format: int64, nullable: true}
        amount: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        description: {type: string, nullable: true}
        receiptNo: {type: string, nullable: true}
        invoiceNo: {type: string, nullable: true}
        remark: {type: string, nullable: true}
        stationName: {type: string, nullable: true}
    ApprovalApplication:
      type: object
      required: [templateId, requestKey]
      properties:
        templateId: {type: integer, format: int64}
        requestKey: {type: string}
        applicationScope: {type: string, enum: [DAILY, TASK], nullable: true}
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}}
        generalSnapshot: {type: object, additionalProperties: true}
        tireRequestId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApprovalAction:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer}
        comment: {type: string}
        targetFlowNodeId: {type: integer, format: int64, nullable: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApprovalResubmission:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ApprovalExpenseItem'}}
        generalSnapshot: {type: object, additionalProperties: true}
        attachmentIds: {type: array, items: {type: integer, format: int64}}
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, examples: ['0']}
        message: {type: string}
        data: {}
        requestId: {type: string}
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: {type: string}
        password: {type: string}
        terminal:
          type: string
          enum: [WEB, MINI]
          default: WEB
          description: 终端类型。管理端传 WEB，微信小程序传 MINI。
    CurrentUser:
      type: object
      description: 当前登录账号、单一角色、权限，以及司机账号的小程序身份扩展信息。
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        role:
          type: object
          properties:
            id: {type: integer, format: int64}
            code: {type: string}
            name: {type: string}
        permissions:
          type: array
          items: {type: string}
        driverId: {type: [integer, 'null'], format: int64}
        driverType: {type: [string, 'null'], enum: [INTERNAL, OUTSOURCED, null]}
        driverName: {type: [string, 'null']}
        currentVehicleId: {type: [integer, 'null'], format: int64}
        currentPlateNo: {type: [string, 'null']}
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: integer, enum: [0, 1]}
    ProductRequest:
      type: object
      required: [name, enabled]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        expectedVersion: {type: [integer, 'null']}
    UserRequest:
      type: object
      required: [phone, roleId, status]
      properties:
        phone: {type: string}
        password: {type: [string, 'null'], minLength: 6, description: 新增账号必填；编辑账号不使用该字段重置密码}
        roleId: {type: integer, format: int64}
        status: {type: integer, enum: [0, 1]}
    RoleRequest:
      type: object
      required: [roleName, status]
      properties:
        roleCode: {type: string, readOnly: true, description: 服务端自动生成且不可修改}
        roleName: {type: string}
        status: {type: integer, enum: [0, 1]}
    RolePermissionRequest:
      type: object
      properties:
        permissionCodes:
          type: array
          items: {$ref: '#/components/schemas/FunctionCode'}
    TaskStatus:
      type: string
      enum: [UNPUBLISHED, PUBLISHED, IN_TRANSIT, TRANSFER_PENDING, COMPLETED, CANCELLED]
    AttachmentPurpose:
      type: string
      enum: [WEIGHT_ADJUST, ROUTE_UNLOAD_WEIGHT_TICKET, IMPORT_FILE]
    Attachment:
      type: object
      required: [id, ownerType, ownerId, purpose, storageKey, originalFilename, fileSize, fileHash, uploadedBy, uploadedAt]
      properties:
        id: {type: integer, format: int64}
        ownerType: {type: string}
        ownerId: {type: integer, format: int64}
        purpose: {$ref: '#/components/schemas/AttachmentPurpose'}
        originalFilename: {type: string}
        contentType: {type: [string, 'null']}
        fileSize: {type: integer, format: int64}
        fileHash: {type: string}
        storageKey: {type: string}
        uploadedBy: {type: integer, format: int64}
        uploadedAt: {type: string, format: date-time}
    DecimalMoney:
      type: string
      pattern: '^\\d{1,16}(\\.\\d{1,2})?$'
      description: 金额 DECIMAL(18,2)，接口以字符串传输避免浮点误差。
    DecimalWeight:
      type: string
      pattern: '^\\d{1,15}(\\.\\d{1,3})?$'
      description: 重量/电量/气量 DECIMAL(18,3)，接口以字符串传输避免浮点误差。
    DriverCreateRequest:
      type: object
      required: [driverType, name, phone, idCardNo, drivingLicenseNo, status, initialPassword]
      properties:
        driverType: {type: string, enum: [INTERNAL, OUTSOURCED]}
        name: {type: string}
        phone: {type: string}
        status: {type: integer, enum: [0, 1]}
        initialPassword: {type: string, minLength: 6, writeOnly: true, description: 新增司机时必填；同手机号已有任何账号时拒绝创建}
        drivingLicenseNo: {type: string, minLength: 1, description: 司机驾驶证号；首尾空格由服务端去除；全局唯一}
        idCardNo: {type: string, pattern: '^[1-9][0-9]{16}[0-9Xx]$', description: 中国大陆18位身份证；校验出生日期及校验码；全局唯一}
      description: 出生日期与年龄由合法身份证号派生并只读返回，不允许在请求中人工设置。
    VehicleRequest:
      type: object
      required: [plateNo, vehicleLicenseNo, insuranceComplete, energyType, maxLoad, loadStandardType, status]
      properties:
        plateNo: {type: string}
        vehicleLicenseNo: {type: string, minLength: 1, description: 车辆行驶证号；首尾空格由服务端去除；全局唯一}
        insuranceComplete: {type: boolean}
        energyType: {type: string}
        maxLoad: {$ref: '#/components/schemas/DecimalWeight'}
        loadStandardType: {type: string, enum: [PERCENT, FIXED]}
        loadStandardPercent: {type: [number, 'null']}
        loadStandardMinLoad: {$ref: '#/components/schemas/DecimalWeight'}
        status: {type: integer, enum: [0, 1]}
    RouteTemplateRequest:
      type: object
      required: [stableCode, name, customerName, productId, loadingPlace, unloadingPlace, defaultUnitPrice, defaultInformationFee, defaultDriverSalary]
      properties:
        stableCode: {type: string, maxLength: 64}
        name: {type: string, maxLength: 128}
        customerName: {type: string, maxLength: 128}
        productId: {type: integer, format: int64}
        loadingPlace: {type: string}
        unloadingPlace: {type: string}
        defaultUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
        defaultInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
        defaultDriverSalary: {$ref: '#/components/schemas/DecimalMoney'}
        remark: {type: [string, 'null']}
        expectedVersion: {type: [integer, 'null'], description: 更新时必填}
    DispatchBatchRequest:
      type: object
      required: [businessDate, rows]
      properties:
        businessDate: {type: string, format: date}
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [templateStableCode, driverId]
            properties:
              templateStableCode: {type: string}
              driverId: {type: integer, format: int64}
              outsourcedPlateNo: {type: [string, 'null'], description: 后端确认司机为 OUTSOURCED 时必填}
              actualUnitPrice: {$ref: '#/components/schemas/DecimalMoney'}
              actualInformationFee: {$ref: '#/components/schemas/DecimalMoney'}
              initialSalary: {$ref: '#/components/schemas/DecimalMoney'}
              remark: {type: [string, 'null']}
    DispatchConfirmRequest:
      type: object
      required: [previewId, requestKey, batch]
      properties:
        previewId: {type: string}
        requestKey: {type: string}
        batch: {$ref: '#/components/schemas/DispatchBatchRequest'}
    TaskTransferRequest:
      type: object
      required: [newDriverId, allParticipantSalaries, newSalary, reason, expectedVersion, expectedCurrentParticipantId]
      properties:
        newDriverId: {type: integer, format: int64}
        outsourcedPlateNo: {type: [string, 'null']}
        allParticipantSalaries:
          type: array
          items:
            type: object
            required: [participantId, amount]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
        newSalary: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
        expectedVersion: {type: integer}
        expectedCurrentParticipantId: {type: integer, format: int64}
    TaskDepartRequest:
      type: object
      required: [requestKey, expectedVersion]
      properties:
        requestKey: {type: string}
        expectedVersion: {type: integer}
    TaskUnloadRequest:
      type: object
      required: [grossWeight, tareWeight, ticketAttachmentIds, requestKey]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        ticketAttachmentIds: {type: array, minItems: 1, items: {type: integer, format: int64}}
        requestKey: {type: string}
    TaskCancelRequest:
      type: object
      required: [reason, expectedVersion, requestKey]
      properties:
        reason: {type: string}
        expectedVersion: {type: integer}
        requestKey: {type: string}
    TaskWeightAdjustmentRequest:
      type: object
      required: [grossWeight, tareWeight, reason, expectedVersion]
      properties:
        grossWeight: {$ref: '#/components/schemas/DecimalWeight'}
        tareWeight: {$ref: '#/components/schemas/DecimalWeight'}
        reason: {type: string}
        evidenceAttachmentIds: {type: array, items: {type: integer, format: int64}}
        expectedVersion: {type: integer}
    TaskAmountAdjustmentRequest:
      type: object
      required: [expectedVersion, amountKind, afterAmount, reason]
      properties:
        expectedVersion: {type: integer}
        amountKind: {type: string, enum: [UNIT_PRICE, INFORMATION_FEE]}
        afterAmount: {$ref: '#/components/schemas/DecimalMoney'}
        reason: {type: string}
    TaskSalariesConfirmRequest:
      type: object
      required: [salaries, reason, requestKey]
      properties:
        salaries:
          type: array
          items:
            type: object
            required: [participantId, amount, expectedVersion]
            properties:
              participantId: {type: integer, format: int64}
              amount: {$ref: '#/components/schemas/DecimalMoney'}
              expectedVersion: {type: integer}
        reason: {type: string}
        requestKey: {type: string}
